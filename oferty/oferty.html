  const num = (v) => (v == null || v === '' || !Number.isFinite(Number(v)) ? null : Number(v));
  const zl = (v) => (num(v) == null ? '–' : Math.round(num(v)).toLocaleString('pl-PL') + ' zł');
  const signed = (v) => (num(v) == null ? '–' : (num(v) >= 0 ? '+' : '−') + Math.abs(Math.round(num(v))).toLocaleString('pl-PL') + ' zł');
  const pct = (v) => (num(v) == null ? '–' : Math.round(num(v)) + '%');
  const fold = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l');
  const when = (iso) => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString('pl-PL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };

  const DEMAND = {
    szybki: { label: 'popyt szybki', cls: 'd-szybki', w: 1, rank: 0 },
    sredni: { label: 'popyt średni', cls: 'd-sredni', w: 0.85, rank: 1 },
    brak: { label: 'popyt: brak danych', cls: 'd-brak', w: 0.75, rank: 2 },
    wolny: { label: 'popyt wolny', cls: 'd-wolny', w: 0.6, rank: 3 }
  };
  const VERDICT = { KUP: { cls: 'v-KUP', label: 'KUP', rank: 0 }, NEGOCJUJ: { cls: 'v-NEGOCJUJ', label: 'NEGOCJUJ', rank: 1 }, ODPUSC: { cls: 'v-ODPUSC', label: 'ODPUŚĆ', rank: 3 } };

  function demandKey(v) {
    const f = fold(typeof v === 'object' && v ? v.level : v);
    if (/szyb/.test(f)) return 'szybki';
    if (/sred/.test(f)) return 'sredni';
    if (/woln/.test(f)) return 'wolny';
    return 'brak';
  }
  function verdictKey(v) {
    const f = fold(v).toUpperCase();
    if (/NEGOC/.test(f)) return 'NEGOCJUJ';
    if (/ODPUS/.test(f)) return 'ODPUSC';
    if (/\bKUP\b/.test(f) && !/NIE KUP/.test(f)) return 'KUP';
    return null;
  }

  function normalize(o) {
    const sz = o.sz && !o.sz.__error ? o.sz : {};
    const r = o.r && !o.r.__error ? o.r : null;
    const odrz = o.odrz && !o.odrz.__error ? o.odrz : null;
    const variants = r && Array.isArray(r.warianty) ? r.warianty.filter(Boolean) : [];
    let best = variants.find((v) => v.najlepszy) || null;
    if (!best) for (const v of variants) if (num(v.zysk) != null && (!best || num(v.zysk) > num(best.zysk))) best = v;
    const status = o.kosz ? 'kosz' : r ? 'raport' : odrz ? 'odrzucona' : 'w toku';
    let vk = r ? verdictKey(r.werdykt) : null;
    const dk = demandKey((r && r.popyt) || sz.demand);
    const buy = r && num(r.koszt_zakupu) != null ? num(r.koszt_zakupu) : num(sz.price_pln) != null ? num(sz.price_pln) + (num(sz.shipping_pln) || 0) : null;
    // „KUP” przy cenie powyżej ceny maksymalnej to w praktyce negocjacja
    if (vk === 'KUP' && r && num(r.cena_max) != null && buy != null && buy > num(r.cena_max)) vk = 'NEGOCJUJ';
    const wer = o.wer && !o.wer.__error ? o.wer : null;
    const profit = best ? num(best.zysk) : null;
    const photos = [].concat(sz.photos || [], (r && r.zdjecia) || [], sz.photo || []).map(safeUrl).filter((u, i, a) => u && a.indexOf(u) === i);
    const score = profit != null ? profit * DEMAND[dk].w : num(sz.repair_budget_pln) != null ? num(sz.repair_budget_pln) * DEMAND[dk].w * 0.5 : -1e9;
    return {
      id: o.id, raw: o, sz, r, odrz, wer, status, vk, dk, best, variants, buy, profit, photos, score,
      roi: best ? num(best.roi) : null,
      fav: !!o.ulubione,
      added: sz.saved_at || o.updated,
      deletedAt: o.del && o.del.usunieto,
      title: sz.title || (r && r.model) || o.id,
      url: safeUrl(sz.url) || safeUrl(r && r.link),
      portal: sz.portal || (o.id.split('-')[0] || ''),
      risk: r ? num(r.ryzyko) : null,
      errors: ['sz', 'r', 'odrz', 'wer'].filter((k) => o[k] && o[k].__error).map((k) => o[k].__error),
      text: fold([o.id, sz.title, r && r.model, r && r.diagnoza, r && r.uzasadnienie, sz.description, odrz && odrz.powod].join(' '))
    };
  }

  let ALL = [];
  const load = () => { ALL = RAW.offers.map(normalize); };
  load();

  const state = { sort: 'score', view: 'all', q: '', showSkip: false };
  try { Object.assign(state, JSON.parse(localStorage.getItem('oferty-stan') || '{}')); } catch (_) { /* brak pamięci */ }
  const save = () => { try { localStorage.setItem('oferty-stan', JSON.stringify(state)); } catch (_) { /* brak */ } };

  function sorter(key) {
    const nz = (v, d) => (v == null ? d : v);
    return {
      score: (a, b) => nz(a.vk && VERDICT[a.vk].rank, 2) - nz(b.vk && VERDICT[b.vk].rank, 2) || b.score - a.score,
      profit: (a, b) => nz(b.profit, -1e9) - nz(a.profit, -1e9),
      roi: (a, b) => nz(b.roi, -1e9) - nz(a.roi, -1e9),
      demand: (a, b) => DEMAND[a.dk].rank - DEMAND[b.dk].rank || b.score - a.score,
      risk: (a, b) => nz(a.risk, 99) - nz(b.risk, 99) || b.score - a.score,
      price: (a, b) => nz(a.buy, 1e9) - nz(b.buy, 1e9),
      new: (a, b) => String(b.added || '').localeCompare(String(a.added || ''))
    }[key] || sorter('score');
  }

  function riskBar(r) {
    if (r == null) return '';
    const cls = r >= 7 ? 'hi' : r <= 3 ? 'lo' : '';
    let s = '<span class="risk ' + cls + '" title="Ryzyko ' + r + '/10">';
    for (let i = 1; i <= 10; i++) s += '<i class="' + (i <= r ? 'on' : '') + '"></i>';
    return s + '</span>';
  }

  function statusBadge(x) {
    if (x.status === 'kosz') return '<span class="badge v-KOSZ">W KOSZU</span>';
    if (x.status === 'odrzucona') return '<span class="badge v-ODRZ">ODRZUCONA</span>';
    if (x.status === 'w toku') return '<span class="badge v-TOKU">W TOKU</span>';
    return x.vk ? '<span class="badge ' + VERDICT[x.vk].cls + '">' + VERDICT[x.vk].label + '</span>' : '<span class="badge v-TOKU">RAPORT</span>';
  }

  const starBtn = (x) => '<button class="star' + (x.fav ? ' on' : '') + '" data-star="' + esc(x.id) + '" title="' +
    (LIVE ? (x.fav ? 'Usuń z ulubionych' : 'Dodaj do ulubionych') : 'Ulubione działają po otwarciu skrótem „Oferty do naprawy”') + '"' + (LIVE ? '' : ' disabled') + '>' + (x.fav ? '★' : '☆') + '</button>';

  const NOIMG = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-8 8"/></svg>';
  const EMPTY = '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18l-2 12H5L3 7Z"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>';

  function tile(x) {
    const img = x.photos[0];
    let money;
    if (x.profit != null) {
      money = '<div class="money"><span class="profit ' + (x.profit >= 0 ? 'pos' : 'neg') + '">' + signed(x.profit) + '</span>' +
        (x.roi != null ? '<span class="roi">ROI ' + pct(x.roi) + '</span>' : '') + '</div>';
    } else if (num(x.sz.repair_budget_pln) != null) {
      money = '<div class="money"><span class="profit budget">Budżet na naprawę: ' + zl(x.sz.repair_budget_pln) + '</span></div>';
    } else money = '';
    const facts = [['Zakup', zl(x.buy)]];
    if (x.r && num(x.r.cena_max) != null) facts.push(['Kup maks. za', zl(x.r.cena_max)]);
    if (x.status !== 'raport' && num(x.sz.used_median_pln) != null) facts.push(['Mediana ofert sprawnych', zl(x.sz.used_median_pln)]);
    if (x.risk != null) facts.push(['Ryzyko', x.risk + '/10' + riskBar(x.risk)]);
    if (x.best && x.best.nazwa) facts.push(['Wariant', esc(x.best.nazwa)]);
    const tone = x.status === 'raport' ? (x.vk || '') : x.status === 'w toku' ? 'toku' : x.status === 'odrzucona' ? 'odrzucona' : '';
    return '<article class="tile' + (tone ? ' t-' + tone : '') + (x.vk === 'ODPUSC' || x.status === 'kosz' ? ' dim' : '') + '">' + starBtn(x) +
      '<button class="open" data-id="' + esc(x.id) + '" aria-label="Szczegóły: ' + esc(x.title) + '">' +
      '<div class="ph">' + (img ? '<img loading="lazy" src="' + esc(img) + '" alt="" onerror="this.remove()">' : '') +
      '<div class="noimg">' + (img ? '' : NOIMG + 'brak zdjęcia') + '</div>' +
      '<div class="badges">' + statusBadge(x) + (x.r && x.r.rynek_uwagi ? '<span class="badge v-RYNEK">RYNEK DO WERYFIKACJI</span>' : '') + '<span class="badge ' + DEMAND[x.dk].cls + '">' + esc(DEMAND[x.dk].label) + '</span></div>' +
      (x.photos.length > 1 ? '<span class="count">' + x.photos.length + ' zdjęć</span>' : '') + '</div>' +
      '<div class="body"><div class="title">' + esc(x.title) + '</div>' + money +
      '<dl class="facts">' + facts.map(([k, v]) => '<dt>' + k + '</dt><dd>' + v + '</dd>').join('') + '</dl>' +
      (x.status === 'odrzucona' && x.odrz && x.odrz.powod ? '<div class="reason"><b>Mietek:</b> ' + esc(x.odrz.powod) + '</div>' : '') +
      (x.errors.length ? '<div class="small warn">Błąd danych: ' + esc(x.errors.join('; ')) + '</div>' : '') +
      '<div class="foot"><span class="portal">' + esc(x.portal) + '</span>' + esc(x.status === 'kosz' ? 'usunięto ' + when(x.deletedAt) : 'dodano ' + when(x.added)) + '</div>' +
      '</div></button></article>';
  }

  const VIEWS = [
    ['all', 'Wszystkie', (x) => x.status !== 'kosz'],
    ['fav', '★ Ulubione', (x) => x.fav && x.status !== 'kosz'],
    ['KUP', 'KUP', (x) => x.status === 'raport' && x.vk === 'KUP'],
    ['NEGOCJUJ', 'NEGOCJUJ', (x) => x.status === 'raport' && x.vk === 'NEGOCJUJ'],
    ['ODPUSC', 'ODPUŚĆ', (x) => x.status === 'raport' && x.vk === 'ODPUSC'],
    ['toku', 'W toku', (x) => x.status === 'w toku'],
    ['odrz', 'Odrzucone przez Mietka', (x) => x.status === 'odrzucona'],
    ['kosz', 'Kosz', (x) => x.status === 'kosz']
  ];

  function section(title, list, extra) {
    return '<h2>' + title + ' <span class="cnt">(' + list.length + ')</span></h2>' + (extra || '') +
      (list.length ? '<div class="grid">' + list.map(tile).join('') + '</div>' : '<div class="empty"><div class="ico">' + EMPTY + '</div><b>Nic tu nie ma</b>' +
        (state.q.trim() ? 'Żadna oferta nie pasuje do „' + esc(state.q.trim()) + '”.' : 'Nowe oferty pojawią się tu same, gdy boty je przeanalizują.') + '</div>');
  }

  function render() {
    const q = fold(state.q.trim());
    const match = (x) => !q || x.text.includes(q);
    const sort = sorter(state.sort);
    let html = '';
    if (state.view === 'all') {
      const reports = ALL.filter((x) => x.status === 'raport' && match(x) && (state.showSkip || x.vk !== 'ODPUSC')).sort(sort);
      const pending = ALL.filter((x) => x.status === 'w toku' && match(x)).sort(sort);
      const rejected = ALL.filter((x) => x.status === 'odrzucona' && match(x)).sort(sorter('new'));
      html += section('Raporty Andrzeja', reports);
      if (pending.length) html += section('W toku – czekają na Mietka, Rabina lub Andrzeja', pending);
      if (rejected.length) html += section('Odrzucone przez Mietka', rejected, '<div class="small" style="margin:-6px 0 10px">Powód odrzucenia jest na kafelku. Kliknij, żeby zobaczyć zdjęcia, opis i cenę.</div>');
    } else {
      const v = VIEWS.find((w) => w[0] === state.view) || VIEWS[0];
      const list = ALL.filter((x) => v[2](x) && match(x)).sort(state.view === 'kosz' ? (a, b) => String(b.deletedAt || '').localeCompare(String(a.deletedAt || '')) : sort);
      html += section(v[1], list, state.view === 'kosz' ? '<div class="small" style="margin:-6px 0 10px">Otwórz ofertę, żeby ją przywrócić albo usunąć na zawsze.</div>' : '');
    }
    $('#app').innerHTML = html;
  }

  function header() {
    const c = { KUP: 0, NEGOCJUJ: 0, ODPUSC: 0 };
    for (const x of ALL) if (x.status === 'raport' && x.vk) c[x.vk]++;
    $('#gen').textContent = RAW.generated ? 'odświeżono ' + when(RAW.generated) : '';
    $('#stats').innerHTML = Object.keys(c).map((k) => '<span class="stat ' + k + '"><span class="dot"></span>' + VERDICT[k].label + ' <b>' + c[k] + '</b></span>').join('');
    $('#vf').innerHTML = VIEWS.map(([k, l, f]) => '<button class="chip" data-v="' + k + '" aria-pressed="' + (state.view === k) + '">' + l +
      ' <span class="n">' + ALL.filter(f).length + '</span></button>').join('');
    $('#sort').value = state.sort;
    $('#q').value = state.q;
    $('#showSkip').checked = !!state.showSkip;
    $('#modeNote').innerHTML = LIVE ? '' : '<div class="note">To jest podgląd z pliku. Żeby dodawać do ulubionych i usuwać oferty, otwórz stronę skrótem „Oferty do naprawy” (na pulpicie).</div>';
  }

  // ---- Markdown z raportu (bez HTML z zewnątrz: najpierw escape) ----
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[\s(])_([^_]+)_(?=[\s).,;:!?]|$)/g, '$1<i>$2</i>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, t, u) => '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, (m, p, u) => p + '<a href="' + u + '" target="_blank" rel="noopener">' + (u.length > 60 ? u.slice(0, 57) + '…' : u) + '</a>');
  }
  function markdown(md) {
    const lines = String(md || '').replace(/\r/g, '').split('\n');
    const out = [];
    let i = 0;
    const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
    while (i < lines.length) {
      const l = lines[i];
      if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i + 1])) {
        const head = cells(l);
        i += 2;
        const rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) rows.push(cells(lines[i++]));
        out.push('<div class="tbl"><table><thead><tr>' + head.map((h) => '<th>' + inline(h) + '</th>').join('') + '</tr></thead><tbody>' +
          rows.map((r) => '<tr>' + r.map((c) => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>');
        continue;
      }
      let m;
      if ((m = l.match(/^(#{1,6})\s+(.*)$/))) { out.push('<h4>' + inline(m[2]) + '</h4>'); i++; continue; }
      if (/^\s*([-*•]|\d+[.)])\s+/.test(l)) {
        const ordered = /^\s*\d+[.)]/.test(l);
        const items = [];
        while (i < lines.length && /^\s*([-*•]|\d+[.)])\s+/.test(lines[i])) items.push(lines[i++].replace(/^\s*([-*•]|\d+[.)])\s+/, ''));
        out.push((ordered ? '<ol>' : '<ul>') + items.map((t) => '<li>' + inline(t) + '</li>').join('') + (ordered ? '</ol>' : '</ul>'));
        continue;
      }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
      if (!l.trim()) { i++; continue; }
      const para = [];
      while (i < lines.length && lines[i].trim() && !/^(#{1,6})\s|^\s*([-*•]|\d+[.)])\s+|^\s*\|/.test(lines[i])) para.push(lines[i++]);
      if (para.length) out.push('<p>' + para.map(inline).join('<br>') + '</p>');
      else i++;
    }
    return out.join('');
  }

  // ---- Szczegóły ----
  const dlg = $('#dlg');
  let cur = null;
  let photoIdx = 0;

  function kpi(l, v, cls) { return '<div class="kpi"><div class="l">' + esc(l) + '</div><div class="v ' + (cls || '') + '">' + v + '</div></div>'; }
  function link(u, t) { const s = safeUrl(u); return s ? '<a href="' + esc(s) + '" target="_blank" rel="noopener">' + esc(t || 'link') + '</a>' : ''; }

  function partCell(p) {
    if (!p) return '–';
    if (typeof p === 'string') return esc(p);
    const price = num(p.cena) != null ? zl(p.cena) + (num(p.dostawa) ? ' + ' + zl(p.dostawa) + ' dostawa' : '') : (p.brak || p.cena === 'brak' ? 'brak' : '–');
    // link do wyszukiwania zamiast do konkretnej oferty – cena niesprawdzona
    const search = p.link && /\/listing|\/kategoria|\/wholesale|\/w\/wholesale|SearchText=|[?&](string|q|query|search)=|\/oferty\/q|\/q-|\/szukaj/i.test(p.link);
    return price + (p.link ? ' · ' + link(p.link, search ? 'wyszukiwanie' : 'oferta') : ' · <span class="warn">brak linku</span>') +
      (search ? '<div class="small warn">⚠ link do wyszukiwania, nie do oferty – cena niesprawdzona</div>' : '') +
      (p.opis ? '<div class="small">' + esc(p.opis) + '</div>' : '');
  }

  function actions(x) {
    const dis = LIVE ? '' : ' disabled title="Działa po otwarciu skrótem „Oferty do naprawy”"';
    if (x.status === 'kosz') {
      return '<button class="btn ghost" data-act="przywroc"' + dis + '>↩ Przywróć</button><button class="btn danger" data-act="usun-na-zawsze"' + dis + '>Usuń na zawsze</button>';
    }
    return '<button class="btn ghost' + (x.fav ? ' on' : '') + '" data-act="ulubione"' + dis + '>' + (x.fav ? '★ W ulubionych' : '☆ Dodaj do ulubionych') + '</button>' +
      '<button class="btn danger" data-act="usun"' + dis + '>🗑 Usuń</button>';
  }

  function details(x) {
    const r = x.r || {};
    const sz = x.sz;
    const d = sz.demand || {};
    let h = '<button class="close" aria-label="Zamknij">×</button><div class="dlg">';
    h += '<div class="gal"><div class="main">' + (x.photos.length ? '<img id="big" alt="">' : '<div class="small" style="color:#ccc">brak zdjęć</div>') +
      (x.photos.length > 1 ? '<button class="nav prev" aria-label="Poprzednie">‹</button><button class="nav next" aria-label="Następne">›</button>' : '') + '</div>' +
      (x.photos.length > 1 ? '<div class="thumbs">' + x.photos.map((p, i) => '<img data-i="' + i + '" src="' + esc(p) + '" alt="" loading="lazy">').join('') + '</div>' : '') + '</div>';
    h += '<div class="info"><h3>' + esc(x.title) + '</h3><div class="row">' + statusBadge(x);
    if (x.vk && num(r.cena_max) != null) h += '<span class="badge ' + VERDICT[x.vk].cls + '">kup maks. za ' + zl(r.cena_max) + '</span>';
    h += '<span class="badge ' + DEMAND[x.dk].cls + '">' + esc(DEMAND[x.dk].label) + '</span></div>';
    h += '<div class="row">' + (x.url ? '<a class="btn" href="' + esc(x.url) + '" target="_blank" rel="noopener">Otwórz ofertę ↗</a>' : '') + actions(x) + '</div>';
    h += '<div class="small">' + esc(x.id) + ' · ' + esc(x.portal) + (sz.location ? ' · ' + esc(sz.location) : '') + ' · dodano ' + esc(when(x.added)) +
      (x.status === 'kosz' ? ' · usunięto ' + esc(when(x.deletedAt)) : '') + '</div>';
    if (x.odrz && x.odrz.powod) h += '<div class="why bad"><b>Mietek odrzucił:</b> ' + inline(x.odrz.powod) + '</div>';
    if (r.uzasadnienie) h += '<div class="why"><b>Werdykt Andrzeja:</b> ' + inline(r.uzasadnienie) + '</div>';
    if (x.errors.length) h += '<div class="why bad">Błąd w plikach danych: ' + esc(x.errors.join('; ')) + '</div>';

    h += '<div class="kpis">' +
      kpi('Cena zakupu z dostawą', zl(x.buy)) +
      kpi('Cena sprzedaży przyjęta', zl(num(r.wartosc_sprzedazy) != null ? r.wartosc_sprzedazy : sz.used_median_pln)) +
      (x.profit != null ? kpi('Najlepszy zysk netto', signed(x.profit), x.profit >= 0 ? 'pos' : 'neg') : kpi('Budżet na naprawę', zl(sz.repair_budget_pln))) +
      (x.roi != null ? kpi('ROI', pct(x.roi)) : '') +
      (x.risk != null ? kpi('Ryzyko', x.risk + '/10 ' + riskBar(x.risk)) : '') +
      (num(r.czas_pracy_h) != null ? kpi('Czas pracy', num(r.czas_pracy_h) + ' h') : '') +
      (num(r.zysk_najgorszy) != null ? kpi('Najgorszy scenariusz', signed(r.zysk_najgorszy), num(r.zysk_najgorszy) >= 0 ? 'pos' : 'neg') : '') +
      (num(r.zysk_plan_b) != null ? kpi('Plan B (na części)', signed(r.zysk_plan_b), num(r.zysk_plan_b) >= 0 ? 'pos' : 'neg') : '') +
      '</div>';

    if (r.rynek_uwagi) h += '<div class="why"><b>Uwaga o cenach porównawczych:</b> ' + inline(r.rynek_uwagi) + '</div>';

    if (x.variants.length) {
      h += '<div class="sec"><h4>Warianty naprawy</h4><div class="tbl"><table><thead><tr><th>Wariant</th><th class="n">Części</th><th class="n">Szansa</th><th class="n">Czas</th><th class="n">Zysk</th><th class="n">ROI</th></tr></thead><tbody>' +
        x.variants.map((v) => '<tr class="' + (v === x.best ? 'best' : '') + '"><td>' + esc(v.nazwa || '') + (v.uwagi ? '<div class="small">' + esc(v.uwagi) + '</div>' : '') + '</td><td class="n">' + zl(v.koszt_czesci) +
          '</td><td class="n">' + pct(v.szansa_pct) + '</td><td class="n">' + (num(v.czas_h) != null ? num(v.czas_h) + ' h' : '–') + '</td><td class="n ' + (num(v.zysk) >= 0 ? 'pos' : 'neg') + '">' + signed(v.zysk) +
          '</td><td class="n">' + pct(v.roi) + '</td></tr>').join('') + '</tbody></table></div>' +
        (r.prog_oplacalnosci_plyty ? '<div class="small" style="margin-top:6px">' + inline(r.prog_oplacalnosci_plyty) + '</div>' : '') + '</div>';
    }
    if (r.diagnoza) h += '<div class="sec"><h4>Diagnoza (Mietek)</h4><div>' + inline(r.diagnoza) + '</div></div>';
    if (Array.isArray(r.czesci) && r.czesci.length) {
      h += '<div class="sec"><h4>Części (Rabin)</h4><div class="tbl"><table><thead><tr><th>Część</th><th>Tania</th><th>OEM</th></tr></thead><tbody>' +
        r.czesci.map((p) => '<tr><td>' + esc(p.nazwa || '') + (p.grupa ? '<div class="small">' + esc(p.grupa) + '</div>' : '') + '</td><td>' + partCell(p.tania) + '</td><td>' + partCell(p.oem) + '</td></tr>').join('') +
        '</tbody></table></div></div>';
    }
    h += '<div class="sec"><h4>Rynek i popyt</h4><div class="tbl"><table class="kv"><tbody>' +
      '<tr><td>Cena w ofercie</td><td class="n">' + zl(sz.price_pln) + (num(sz.shipping_pln) != null ? ' + dostawa ' + zl(sz.shipping_pln) : '') + '</td></tr>' +
      '<tr><td>Mediana aktywnych ofert sprawnych</td><td class="n">' + zl(sz.used_median_pln) + ' (' + (sz.used_offers || 0) + ' ofert; kwartyle ' + zl(sz.used_p25_pln) + '–' + zl(sz.used_p75_pln) + '; ceny ogłoszeń, nie transakcji)</td></tr>' +
      '<tr><td>Budżet na naprawę</td><td class="n">' + zl(sz.repair_budget_pln) + '</td></tr>' +
      '<tr><td>Popyt</td><td class="n">' + esc(d.level || DEMAND[x.dk].label) + (num(d.median_listing_age_days) != null ? ' · ogłoszenia wiszą średnio ' + d.median_listing_age_days + ' dni, starszych niż 30 dni: ' + d.older_than_30_days_pct + '%' : '') + '</td></tr>' +
      (sz.search_query ? '<tr><td>Porównywane z</td><td class="n">„' + esc(sz.search_query) + '”</td></tr>' : '') +
      '</tbody></table></div>' +
      (Array.isArray(sz.comparables) && sz.comparables.length ? '<details style="margin-top:6px"><summary class="small" style="cursor:pointer">Zapisane oferty porównawcze (' + sz.comparables.length + ')</summary><div class="tbl"><table><tbody>' +
        sz.comparables.map((c) => '<tr><td>' + (safeUrl(c.url) ? link(c.url, c.title) : esc(c.title)) + '</td><td class="n">' + zl(c.price) + '</td></tr>').join('') + '</tbody></table></div></details>' : '') + '</div>';
    const li = (a) => '<ul>' + a.map((t) => '<li>' + esc(typeof t === 'string' ? t : t.text || '') + '</li>').join('') + '</ul>';
    const w = x.wer;
    if (w) {
      if (Array.isArray(w.usterki) && w.usterki.length) h += '<div class="sec"><h4>Usterki z opisu (sprawdził Mietek)</h4>' + li(w.usterki) + '</div>';
      if (Array.isArray(w.ostrzezenia) && w.ostrzezenia.length) h += '<div class="sec"><h4>Ostrzeżenia (sprawdził Mietek)</h4>' + li(w.ostrzezenia) + '</div>';
      if (Array.isArray(w.poprawki) && w.poprawki.length) h += '<div class="sec"><h4>Poprawki Mietka do danych Adiego</h4><ul>' +
        w.poprawki.map((p) => '<li><s>' + esc(p.adi || '') + '</s> → ' + esc(p.mietek || '') + '</li>').join('') + '</ul></div>';
    } else if (Array.isArray(sz.risks) && sz.risks.length) h += '<div class="sec"><h4>Ostrzeżenia (automatyczne, niesprawdzone)</h4>' + li(sz.risks) + '</div>';
    if (sz.description) h += '<div class="sec"><h4>Opis sprzedającego</h4><div class="desc">' + esc(sz.description) + '</div></div>';
    if (r.raport_md) h += '<div class="sec"><h4>Pełny raport Andrzeja</h4><div class="md">' + markdown(r.raport_md) + '</div></div>';
    h += '</div></div>';
    return h;
  }

  function showPhoto(i) {
    if (!cur || !cur.photos.length) return;
    photoIdx = (i + cur.photos.length) % cur.photos.length;
    const big = $('#big', dlg);
    if (big) big.src = cur.photos[photoIdx];
    dlg.querySelectorAll('.thumbs img').forEach((t) => t.classList.toggle('on', Number(t.dataset.i) === photoIdx));
    const on = dlg.querySelector('.thumbs img.on');
    const strip = dlg.querySelector('.thumbs');
    if (on && strip) strip.scrollLeft = Math.max(0, on.offsetLeft - strip.clientWidth / 2 + on.clientWidth / 2);
  }

  function open(id, keepPhoto) {
    cur = ALL.find((x) => x.id === id);
    if (!cur) { if (dlg.open) dlg.close(); return; }
    const idx = keepPhoto ? photoIdx : 0;
    dlg.innerHTML = details(cur);
    if (!dlg.open) dlg.showModal();
    showPhoto(idx);
    history.replaceState(null, '', '#' + encodeURIComponent(id));
  }

  // ---- Zmiany (tylko przez lokalny serwer) ----
  let toastTimer = null;
  function toast(text, undo) {
    const t = $('#toast');
    t.innerHTML = esc(text) + (undo ? '<button id="undo">Cofnij</button>' : '');
    t.hidden = false;
    if (undo) $('#undo').onclick = () => { t.hidden = true; undo(); };
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 7000 : 3500);
  }

  async function api(path, body) {
    const r = await fetch(path, { method: 'POST', headers: { 'content-type': 'application/json', 'x-oferty': '1' }, body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({ ok: false, error: 'HTTP ' + r.status }));
    if (!j.ok) throw new Error(j.error || 'błąd');
    await refresh(true);
  }

  async function act(name, x) {
    if (!LIVE || !x) return;
    try {
      if (name === 'ulubione') {
        await api('/api/ulubione', { id: x.id, wartosc: !x.fav });
        toast(!x.fav ? 'Dodano do ulubionych' : 'Usunięto z ulubionych');
      } else if (name === 'usun') {
        await api('/api/usun', { id: x.id });
        if (dlg.open) dlg.close();
        toast('Przeniesiono do kosza: ' + x.title, () => api('/api/przywroc', { id: x.id }).then(() => toast('Przywrócono')).catch((e) => toast('Nie udało się: ' + e.message)));
      } else if (name === 'przywroc') {
        await api('/api/przywroc', { id: x.id });
        if (dlg.open) dlg.close();
        toast('Przywrócono: ' + x.title);
      } else if (name === 'usun-na-zawsze') {
        if (!confirm('Usunąć na zawsze „' + x.title + '”? Pliki oferty zostaną skasowane z dysku.')) return;
        await api('/api/usun-na-zawsze', { id: x.id });
        if (dlg.open) dlg.close();
        toast('Usunięto na zawsze');
      }
    } catch (e) {
      toast('Nie udało się: ' + e.message + (/fetch/i.test(e.message) ? ' – czy serwer strony działa? Otwórz skrót „Oferty do naprawy”.' : ''));
    }
  }

  let lastSig = '';
  async function refresh(force) {
    if (!LIVE) return;
    try {
      const r = await fetch('/api/dane', { cache: 'no-store' });
      const j = await r.json();
      const sig = JSON.stringify(j.offers);
      if (!force && sig === lastSig) return;
      lastSig = sig;
      RAW = { generated: j.generated, offers: j.offers };
      load(); header(); render();
      if (dlg.open && cur) open(cur.id, true);
    } catch (_) { /* serwer chwilowo niedostępny */ }
  }

  dlg.addEventListener('click', (e) => {
    if (e.target === dlg || e.target.closest('.close')) return dlg.close();
    if (e.target.closest('.prev')) return showPhoto(photoIdx - 1);
    if (e.target.closest('.next')) return showPhoto(photoIdx + 1);
    const t = e.target.closest('.thumbs img');
    if (t) return showPhoto(Number(t.dataset.i));
    const a = e.target.closest('[data-act]');
    if (a && !a.disabled) act(a.dataset.act, cur);
  });
  dlg.addEventListener('close', () => { cur = null; history.replaceState(null, '', location.pathname + location.search); });
  document.addEventListener('keydown', (e) => {
    if (!dlg.open) return;
    if (e.key === 'ArrowLeft') showPhoto(photoIdx - 1);
    if (e.key === 'ArrowRight') showPhoto(photoIdx + 1);
  });
  $('#app').addEventListener('click', (e) => {
    const s = e.target.closest('[data-star]');
    if (s) { if (!s.disabled) act('ulubione', ALL.find((x) => x.id === s.dataset.star)); return; }
    const el = e.target.closest('[data-id]');
    if (el) open(el.dataset.id);
  });
  $('#sort').addEventListener('change', (e) => { state.sort = e.target.value; save(); render(); });
  $('#q').addEventListener('input', (e) => { state.q = e.target.value; save(); render(); });
  $('#showSkip').addEventListener('change', (e) => { state.showSkip = e.target.checked; save(); render(); });
  $('#vf').addEventListener('click', (e) => {
    const b = e.target.closest('[data-v]');
    if (!b) return;
    state.view = b.dataset.v; save(); header(); render();
  });

  if (!VIEWS.some((v) => v[0] === state.view)) state.view = 'all';
  header();
  render();
  if (location.hash.length > 1) open(decodeURIComponent(location.hash.slice(1)));

  if (LIVE) {
    lastSig = JSON.stringify(RAW.offers);
    setInterval(() => { if (document.visibilityState === 'visible') refresh(false); }, 15000);
  } else {
    // plik jest nadpisywany po każdym nowym raporcie – odśwież, gdy nic nie jest otwarte
    setInterval(() => { if (!dlg.open && document.visibilityState === 'visible' && document.activeElement !== $('#q')) location.reload(); }, 90000);
  }
})();
</script>
</body>
</html>
